<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI World — Interactive Diagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body {
    background: radial-gradient(ellipse at center, #0f172a 0%, #020617 100%);
    color: #e2e8f0;
    user-select: none;
  }

  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 100;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    max-width: calc(100% - 32px);
  }
  .ctrl-btn {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(99, 102, 241, 0.35);
    color: #e2e8f0;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .ctrl-btn:hover {
    background: rgba(99, 102, 241, 0.25);
    border-color: rgba(99, 102, 241, 0.8);
    transform: translateY(-1px);
  }
  .ctrl-btn:active { transform: translateY(0); }

  #legend {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(99, 102, 241, 0.25);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 12px;
    max-width: 240px;
  }
  #legend h4 {
    font-size: 13px;
    margin-bottom: 10px;
    color: #a5b4fc;
    letter-spacing: 0.3px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 5px 0;
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 10px;
    padding: 8px 18px;
    font-size: 12px;
    color: #94a3b8;
    pointer-events: none;
  }

  #viewport {
    width: 100%;
    height: 100%;
    overflow: hidden;
    cursor: grab;
  }
  #viewport.dragging { cursor: grabbing; }

  #canvas {
    position: relative;
    width: 100%;
    height: 100%;
    transform-origin: 0 0;
  }

  #edges {
    position: absolute;
    top: 0;
    left: 0;
    width: 8000px;
    height: 8000px;
    pointer-events: none;
    overflow: visible;
  }
  .edge {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    opacity: 0;
    transition: opacity 0.5s ease, stroke-width 0.3s ease;
  }
  .edge.visible { opacity: 0.55; }
  .edge.hovered { opacity: 1; stroke-width: 3.5; }

  #nodes {
    position: absolute;
    top: 0;
    left: 0;
    width: 8000px;
    height: 8000px;
    overflow: visible;
  }

  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, opacity 0.4s ease;
  }
  .node.entering {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.3);
  }
  .node:hover {
    z-index: 50 !important;
    transform: translate(-50%, -50%) scale(1.08);
  }
  .node.exiting {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.3);
  }

  .node-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    font-weight: 600;
    letter-spacing: 0.2px;
    position: relative;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    transition: box-shadow 0.3s ease, border-color 0.3s ease;
    backdrop-filter: blur(6px);
  }
  .node:hover .node-inner {
    border-color: rgba(255, 255, 255, 0.55);
    box-shadow: 0 8px 40px rgba(99, 102, 241, 0.5);
  }

  .node-root .node-inner {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    font-size: 22px;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
    box-shadow: 0 0 60px rgba(139, 92, 246, 0.6), 0 4px 20px rgba(0, 0, 0, 0.5);
    border: 3px solid rgba(255, 255, 255, 0.3);
    text-align: center;
    padding: 20px;
    line-height: 1.2;
  }
  .node-root:hover .node-inner {
    box-shadow: 0 0 80px rgba(236, 72, 153, 0.7), 0 8px 40px rgba(0, 0, 0, 0.6);
  }

  .node-branch .node-inner {
    width: 160px;
    height: 70px;
    font-size: 15px;
    padding: 0 18px;
    border-radius: 14px;
  }

  .node-sub .node-inner {
    width: 140px;
    height: 56px;
    font-size: 13px;
    padding: 0 14px;
    border-radius: 12px;
  }

  .node-leaf .node-inner {
    width: auto;
    min-width: 110px;
    height: 42px;
    font-size: 11.5px;
    padding: 0 14px;
    border-radius: 10px;
    font-weight: 500;
  }

  .expand-indicator {
    position: absolute;
    right: -10px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    border: 1.5px solid rgba(255, 255, 255, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    transition: all 0.3s ease;
  }
  .node:hover .expand-indicator {
    background: rgba(255, 255, 255, 0.3);
  }
  .node.expanded .expand-indicator {
    transform: translateY(-50%) rotate(45deg);
  }

  .pulse {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: inherit;
    pointer-events: none;
  }
  .node-root .pulse::after {
    content: '';
    position: absolute;
    top: -8px; left: -8px; right: -8px; bottom: -8px;
    border-radius: 50%;
    border: 2px solid rgba(139, 92, 246, 0.6);
    animation: pulse 3s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.8; }
    100% { transform: scale(1.25); opacity: 0; }
  }

  #tooltip {
    position: fixed;
    z-index: 200;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(99, 102, 241, 0.45);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 12.5px;
    max-width: 280px;
    line-height: 1.55;
    color: #e2e8f0;
    pointer-events: none;
    opacity: 0;
    transform: translateY(5px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }
  #tooltip.visible {
    opacity: 1;
    transform: translateY(0);
  }
  #tooltip strong {
    color: #a5b4fc;
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
  }
</style>
</head>
<body>

<div id="controls">
  <button class="ctrl-btn" id="btn-expand">🔓 Expand All</button>
  <button class="ctrl-btn" id="btn-collapse">🔒 Collapse All</button>
  <button class="ctrl-btn" id="btn-reset">🎯 Reset View</button>
  <button class="ctrl-btn" id="btn-zoom-in">➕ Zoom In</button>
  <button class="ctrl-btn" id="btn-zoom-out">➖ Zoom Out</button>
</div>

<div id="legend">
  <h4>🌐 AI World Legend</h4>
  <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#6366f1,#ec4899)"></span>Core Domain</div>
  <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#10b981,#06b6d4)"></span>Learning</div>
  <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#f59e0b,#ef4444)"></span>Neural & Vision</div>
  <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#3b82f6,#6366f1)"></span>Language</div>
  <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#ec4899,#f43f5e)"></span>Generation</div>
  <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#8b5cf6,#6366f1)"></span>Robotics</div>
  <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#64748b,#475569)"></span>Applications</div>
  <div class="legend-item"><span class="legend-dot" style="background:linear-gradient(135deg,#22c55e,#14b8a6)"></span>Ethics & Safety</div>
</div>

<div id="hint">
  💡 Click nodes to expand • Scroll to zoom • Drag to pan • Hover for details
</div>

<div id="viewport">
  <div id="canvas">
    <svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="nodes"></div>
  </div>
</div>

<div id="tooltip"></div>

    const h = HANDLE_WEAKMAP.get(el);
    if (!h) return;
    if (h.hideTimer) { safeClearTimeout(h.hideTimer); h.hideTimer = null; }
    if (h.enterRaf) { cancelAnimationFrame(h.enterRaf); h.enterRaf = null; }
    h.seq = ++__timersSeq;
  }
  const RECONCILE_TIMERS = [];
  function scheduleReconcile() {
    while (RECONCILE_TIMERS.length) safeClearTimeout(RECONCILE_TIMERS.pop());
    const delays = [250, 550, 850];
    delays.forEach((d, idx) => {
      const t = safeTimeout(() => {
        RECONCILE_TIMERS[idx] = null;
        reconcileAll();
      }, d);
      RECONCILE_TIMERS.push(t);
    });
  }
  function reconcileAll() {
    state.nodes.forEach(n => {
      const el = n._el;
      if (!el) return;
      const shouldBeVisible = nodeIsVisible(n);
      if (shouldBeVisible) {
        if (el.style.display === 'none') el.style.display = '';
        if (el.classList.contains('exiting')) el.classList.remove('exiting');
        if (el.style.opacity) el.style.opacity = '';
      } else {
        if (el.style.display !== 'none') {
          el.classList.remove('exiting');
          el.style.display = 'none';
        }
      }
      if (n._expanded && !el.classList.contains('expanded')) el.classList.add('expanded');
      else if (!n._expanded && el.classList.contains('expanded')) el.classList.remove('expanded');
    });
    state.edges.forEach(e => {
      const toNode = state.nodes.get(e.to);
      const shouldBeVisible = toNode ? nodeIsVisible(toNode) : false;
      if (shouldBeVisible) e.el.classList.add('visible'); else e.el.classList.remove('visible');
    });
  }
  function nodeIsVisible(n) {
    if (n.id === TREE.id) return true;
    let p = state.nodes.get(n._parent);
    while (p) {
      if (!p._expanded) return false;
      p = state.nodes.get(p._parent);
    }
    return true;
  }
  function updateVisibility() {
    state.nodes.forEach(n => {
      const visible = nodeIsVisible(n);
      const el = n._el;
      if (!el) return;
      clearHandles(el);
      const h = readHandles(el);
      const mySeq = h.seq;
      if (visible) {
        const wasHidden = el.style.display === 'none';
        const wasExiting = el.classList.contains('exiting');
        if (wasHidden || wasExiting) {
          el.classList.remove('exiting');
          el.style.display = '';
          el.style.opacity = '';
          if (wasHidden || !wasExiting) {
            el.classList.add('entering');
            h.enterRaf = requestAnimationFrame(() => {
              const now = readHandles(el);
              if (now.seq !== mySeq) return;
              if (el.parentNode && el.classList.contains('entering')) el.classList.remove('entering');
              now.enterRaf = null;
            });
          }
        }
      } else {
        if (el.style.display !== 'none' && !el.classList.contains('exiting')) {
          el.classList.remove('entering');
          el.classList.add('exiting');
          h.hideTimer = safeTimeout(() => {
            const now = readHandles(el);
            if (now.seq !== mySeq) return;
            now.hideTimer = null;
            const cur = state.nodes.get(n.id);
            if (!cur || !nodeIsVisible(cur)) {
              el.style.display = 'none';
              el.classList.remove('exiting');
              el.style.opacity = '';
            }
          }, 320);
        }
      }
      if (n._expanded) el.classList.add('expanded'); else el.classList.remove('expanded');
    });

    queueMicrotask(() => { reconcileAll(); });
    state.edges.forEach(e => {
      const toNode = state.nodes.get(e.to);
      const visible = toNode ? nodeIsVisible(toNode) : false;
      if (visible) e.el.classList.add('visible'); else e.el.classList.remove('visible');
    });
    scheduleReconcile();
  }

  nodesLayer.addEventListener('click', (ev) => {
    const el = ev.target.closest('.node');
    if (!el) return;
    const id = el.dataset.id;
    const node = state.nodes.get(id);
    if (!node || !node._childrenCount) return;
    node._expanded = !node._expanded;
    updateVisibility();
    ev.stopPropagation();
  });

  nodesLayer.addEventListener('mouseover', (ev) => {
    const el = ev.target.closest('.node');
    if (!el) return;
    const id = el.dataset.id;
    const node = state.nodes.get(id);
    if (!node) return;
    tooltip.innerHTML = `<strong>${node.label}</strong>${node.desc || ''}`;
    tooltip.classList.add('visible');

    state.edges.forEach(e => {
      if (e.from === id || e.to === id) e.el.classList.add('hovered');
    });
  });
  nodesLayer.addEventListener('mousemove', (ev) => {
    const pad = 16;
    let x = ev.clientX + pad;
    let y = ev.clientY + pad;
    const w = tooltip.offsetWidth;
    const h = tooltip.offsetHeight;
    if (x + w > window.innerWidth - 8) x = ev.clientX - w - pad;
    if (y + h > window.innerHeight - 8) y = ev.clientY - h - pad;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  });
  nodesLayer.addEventListener('mouseout', (ev) => {
    const el = ev.target.closest('.node');
    if (!el) return;
    tooltip.classList.remove('visible');
    state.edges.forEach(e => e.el.classList.remove('hovered'));
  });

  function applyTransform() {
    canvas.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
  }

  function getMaxRadius() {
    let maxR = 0;
    walk(TREE, (n) => { if (n.radius > maxR) maxR = n.radius; });
    const deepestNodePad = NODE_SIZE.leaf ? Math.max(NODE_SIZE.leaf.w, NODE_SIZE.leaf.h) : 150;
    return maxR + deepestNodePad * 0.8;
  }
  function centerOnRoot() {
    const rect = viewport.getBoundingClientRect();
    const fit = getMaxRadius() * 2 + 200;
    state.scale = Math.min(rect.width / fit, rect.height / fit, 1);
    state.x = rect.width / 2 - 4000 * state.scale;
    state.y = rect.height / 2 - 4000 * state.scale;
    applyTransform();
  }

  viewport.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.node')) return;
    state.isDragging = true;
    viewport.classList.add('dragging');
    state.dragStart = { x: e.clientX, y: e.clientY };
    state.origX = state.x; state.origY = state.y;
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!state.isDragging || !state.dragStart) return;
    state.x = state.origX + (e.clientX - state.dragStart.x);
    state.y = state.origY + (e.clientY - state.dragStart.y);
    applyTransform();
  });
  viewport.addEventListener('pointerup', (e) => {
    state.isDragging = false;
    viewport.classList.remove('dragging');
    state.dragStart = null;
    try { viewport.releasePointerCapture(e.pointerId); } catch(_) {}
  });
  viewport.addEventListener('pointercancel', () => {
    state.isDragging = false;
    viewport.classList.remove('dragging');
    state.dragStart = null;
  });

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const delta = -e.deltaY;
    const factor = Math.exp(delta * 0.0015);
    const newScale = Math.min(state.maxScale, Math.max(state.minScale, state.scale * factor));
    const realFactor = newScale / state.scale;
    state.x = mx - (mx - state.x) * realFactor;
    state.y = my - (my - state.y) * realFactor;
    state.scale = newScale;
    applyTransform();
  }, { passive: false });

  document.getElementById('btn-reset').addEventListener('click', () => centerOnRoot());
  document.getElementById('btn-zoom-in').addEventListener('click', () => {
    const rect = viewport.getBoundingClientRect();
    const cx = rect.width/2, cy = rect.height/2;
    const ns = Math.min(state.maxScale, state.scale * 1.25);
    const f = ns / state.scale;
    state.x = cx - (cx - state.x) * f;
    state.y = cy - (cy - state.y) * f;
    state.scale = ns; applyTransform();
  });
  document.getElementById('btn-zoom-out').addEventListener('click', () => {
    const rect = viewport.getBoundingClientRect();
    const cx = rect.width/2, cy = rect.height/2;
    const ns = Math.max(state.minScale, state.scale / 1.25);
    const f = ns / state.scale;
    state.x = cx - (cx - state.x) * f;
    state.y = cy - (cy - state.y) * f;
    state.scale = ns; applyTransform();
  });
  document.getElementById('btn-expand').addEventListener('click', () => {
    state.nodes.forEach(n => { if (n._childrenCount) n._expanded = true; });
    updateVisibility();
  });
  document.getElementById('btn-collapse').addEventListener('click', () => {
    state.nodes.forEach(n => { if (n.id !== TREE.id) n._expanded = (n._depth === 1); });
    updateVisibility();
  });

  window.addEventListener('resize', () => {
    const rect = viewport.getBoundingClientRect();
    if (state.scale * 8000 < Math.max(rect.width, rect.height)) centerOnRoot();
  });

  build();
  updateVisibility();
  requestAnimationFrame(centerOnRoot);
})();
</script>
</body>
</html>
